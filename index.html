<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaFX — Forex Trading</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
  line-height:1.5;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 6%;
  background:#0b1728;
  border-bottom:1px solid #1d3048;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#31d17c;
}

nav{
  display:flex;
  gap:10px;
  align-items:center;
}

button,.btn{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.btn-primary{
  background:#31d17c;
  color:#04110a;
}

.btn-secondary{
  background:#16263b;
  color:#fff;
  border:1px solid #2a405b;
}

.hero{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(135deg,#07111f,#0d1e32);
}

.hero-content{
  max-width:800px;
}

.hero h1{
  font-size:48px;
  margin-bottom:20px;
}

.hero h1 span{
  color:#31d17c;
}

.hero p{
  color:#aebed0;
  font-size:18px;
  margin-bottom:30px;
}
